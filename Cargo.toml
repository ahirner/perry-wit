[package]
name = "perry-wit"
version = "0.1.0"
edition = "2024"
default-run = "perry-wit"

[lints]
workspace = true

[workspace]
members = [
    ".",
    "crates/search-helper",
    "crates/text-helper",
    "crates/fetch-helper",
    "crates/json-helper",
    "crates/number-helper",
    "crates/time-helper",
    "crates/conformance",
    "crates/perry-mir",
    "crates/perry-lower",
    "crates/pliron-wasm",
    "crates/perry-runtime",
    "crates/perry-abi",
    "crates/perry-std",
    "crates/perry-fs",
    "crates/perry-web",
    "crates/perry-codegen",
]

[workspace.lints.rust]
# Items are `pub` only where another crate uses them.
unreachable_pub = "warn"

[workspace.dependencies]
wasmtime = { version = "=49.0.2", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "=49.0.2", default-features = false, features = ["p3", "default-send-request"] }

[profile.dev]
# https://github.com/rust-lang/rust/issues/161824
split-debuginfo = "packed"

[profile.dev.package.perry-hir]
opt-level = 1

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true

[dependencies]
perry-codegen = { path = "crates/perry-codegen" }
perry-lower = { path = "crates/perry-lower" }
perry-mir = { path = "crates/perry-mir" }
pliron = { git = "https://github.com/pliron-org/pliron", rev = "6ff5b3c8a6d5553b8cbee19d58f3c039f10e5a97" }
perry-parser = { git = "https://github.com/PerryTS/perry", rev = "9e29f59d435ee08df161ef460ee6f204fb381d4f" }
wasm-encoder = { version = "0.261", features = ["wasmparser"] }
wasmparser = "0.261"
wit-parser = { version = "0.261" }
wit-component = "0.261"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wat = "1.261.0"

[build-dependencies]
wasmparser = "0.261"

[dev-dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
wasmtime = { workspace = true, features = ["component-model-async"] }
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
tempfile = "3.27.0"
perry-json-helper = { path = "crates/json-helper" }
wasmprinter = "0.261.0"
