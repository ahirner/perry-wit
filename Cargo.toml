[package]
name = "perry-wit"
version = "0.1.1"
edition = "2024"
default-run = "perry-wit"
description = "Compile TypeScript into WASI 0.3 WebAssembly components"
authors = ["Alexander Hirner"]
license = "Apache-2.0"
repository = "https://github.com/ahirner/perry-wit"
homepage = "https://ahirner.github.io/perry-wit/"

[lints]
workspace = true

[workspace]
members = [
  ".",
  "crates/text-helper",
  "crates/normalization-helper",
  "crates/fetch-helper",
  "crates/json-helper",
  "crates/number-helper",
  "crates/decimal-helper",
  "crates/time-helper",
  "crates/conformance",
  "crates/perry-mir",
  "crates/perry-lower",
  "crates/pliron-wasm",
  "crates/pliron-control",
  "crates/perry-runtime",
  "crates/perry-abi",
  "crates/perry-std",
  "crates/perry-fs",
  "crates/perry-web",
  "crates/perry-codegen",
  "crates/perry-diagnostics",
]

[workspace.lints.rust]
# Items are `pub` only where another crate uses them.
unreachable_pub = "warn"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1"
http = "1"
http-body-util = "0.1"
libm = "0.2"
perry-abi = { path = "crates/perry-abi" }
perry-hir = { git = "https://github.com/PerryTS/perry", rev = "be6740f46e85db2ab5524bc11cd5af53f29f7846" }
perry-mir = { path = "crates/perry-mir" }
perry-wit-diagnostics = { path = "crates/perry-diagnostics" }
perry-parser = { git = "https://github.com/PerryTS/perry", rev = "be6740f46e85db2ab5524bc11cd5af53f29f7846" }
perry-runtime = { path = "crates/perry-runtime" }
pliron = { git = "https://github.com/pliron-org/pliron", rev = "58797e44a51220e62bac7c91bab458c6a0e08a9b", default-features = false }
pliron-control = { path = "crates/pliron-control" }
serde = "1.0"
serde_json = "1.0"
tempfile = "3.27.0"
tokio = "1"
wasm-encoder = "0.261"
wasmparser = "0.261"
wasmprinter = "0.261.0"
wasmtime = { version = "=50.0.0", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p3", "default-send-request"] }
wit-parser = "0.261"

[profile.dev]
# https://github.com/rust-lang/rust/issues/161824
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.perry-hir]
opt-level = 1

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true

[dependencies]
perry-codegen = { path = "crates/perry-codegen" }
perry-lower = { path = "crates/perry-lower" }
perry-mir.workspace = true
perry-wit-diagnostics.workspace = true
pliron.workspace = true
perry-parser.workspace = true
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmparser.workspace = true
wit-parser.workspace = true
wit-component = "0.261"
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wit-bindgen = "0.62"

[build-dependencies]
wat = "~1.261.0"
wasmparser.workspace = true

[dev-dependencies]
sha2 = "0.10"
serde = { workspace = true, features = ["derive"] }
wat = "~1.261.0"
bytes.workspace = true
http.workspace = true
http-body = "1"
http-body-util.workspace = true
wasmtime = { workspace = true, features = ["component-model-async"] }
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
tempfile.workspace = true
perry-json-helper = { path = "crates/json-helper" }
wasmprinter.workspace = true
