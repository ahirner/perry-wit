[package]
name = "perry-wit"
version = "0.1.0"
edition = "2024"
default-run = "perry-wit"

[workspace]
members = [
    ".",
    "crates/guest-runtime",
]

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true

[dependencies]
perry-parser = { git = "https://github.com/PerryTS/perry" }
perry-hir = { git = "https://github.com/PerryTS/perry" }
perry-codegen-wasm = { git = "https://github.com/PerryTS/perry" }
perry-transform = { git = "https://github.com/PerryTS/perry" }
swc_ecma_visit = "19.0"
swc_common = "18.0"
swc_ecma_transforms_base = "32.0"
wasm-encoder = { version = "0.258", features = ["wasmparser"] }
wasmparser = "0.258"
wit-parser = { version = "0.258" }
wit-component = "0.258"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wat = "1.260.0"
wasmprinter = "0.260.0"
waffle = "=0.2.0"

[dev-dependencies]
wasmtime = { version = "=48.0.1", default-features = false, features = ["component-model-async", "cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2", "p3"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
tempfile = "=3.27.0"
