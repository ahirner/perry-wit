[package]
name = "perry-wit"
version = "0.1.0"
edition = "2024"
default-run = "perry-wit"

[workspace]
members = [
    ".",
    "crates/json-helper",
    "crates/time-helper",
]

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true

[dependencies]
perry-parser = { git = "https://github.com/PerryTS/perry" }
perry-hir = { git = "https://github.com/PerryTS/perry" }
swc_ecma_visit = "19.0"
swc_common = "18.0"
swc_ecma_transforms_base = "32.0"
wasm-encoder = { version = "0.261", features = ["wasmparser"] }
wasmparser = "0.261"
wit-parser = { version = "0.261" }
wit-component = "0.261"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wat = "1.261.0"
wasmprinter = "0.261.0"
waffle = "0.3.2"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode"] }

[build-dependencies]
wasmparser = "0.261"

[dev-dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
wasmtime = { version = "49.0.2", default-features = false, features = ["component-model-async", "cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "49.0.2", default-features = false, features = ["p3", "default-send-request"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
tempfile = "3.27.0"
perry-json-helper = { path = "crates/json-helper" }
