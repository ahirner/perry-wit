[workspace]
resolver = "3"
members = ["abi", "sys", "core", "std", "web", "fs", "text", "normalization", "fetch", "number", "decimal", "json", "time"]

[workspace.dependencies]
arrayvec = { version = "0.7", default-features = false }
# The build-time normalizer and the runtime properties must share one ICU4X data version.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
libm = "0.2"
perry-abi = { path = "abi" }
perry-rt-sys = { path = "sys" }
perry-runtime = { path = "core" }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"

[profile.release]
opt-level = 2
lto = "fat"
panic = "abort"
strip = true

[profile.compact]
inherits = "release"
opt-level = "z"

# Artifact crates previously overrode opt-level; their dependencies inherited size optimization.
[profile.release.package."*"]
opt-level = "z"

[profile.release.package.perry-abi]
opt-level = "z"

[profile.release.package.perry-rt-sys]
opt-level = "z"
