name: "JS package"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Jobs request only the permissions they need.
permissions: {}

concurrency:
  group: js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Build the compiler component and the npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          rm_cmd: "rmz"
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # Without an auth token the cache is read-only: this workflow never pushes to it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: 'cybertreiber'
      # The npm-package derivation builds, type-checks, tests and packs the package.
      - name: Build the compiler component and the npm package
        run: |
          nix build -L .#perry-wit-wasm --out-link result-compiler
          nix build -L .#npm-package --out-link result-npm-package
          mkdir -p dist
          cp result-compiler/lib/perry-wit.wasm dist/perry-wit.wasm
          cp result-npm-package/perry-wit-*.tgz dist/perry-wit.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perry-wit-npm-package
          path: |
            dist/perry-wit.wasm
            dist/perry-wit.tgz
          if-no-files-found: error
          retention-days: 1

  test:
    name: Build, test and e2e (Node.js ${{ matrix.node }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Node.js release line and the newest.
        node:
          - '22'
          - '26'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache, so a poisoned cache entry cannot reach the build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perry-wit-npm-package
          path: ${{ runner.temp }}/package
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          PERRY_COMPILER_WASM: ${{ runner.temp }}/package/perry-wit.wasm
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      # Tests the tarball that `nix build .#npm-package` wrote, not one this job packs.
      - name: End-to-end test of the packed package
        run: npm run test:e2e -- --tarball "$RUNNER_TEMP/package/perry-wit.tgz"
