name: "CI"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
    tags:
      - 'v*'

# Jobs request only the permissions they need.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4.0.1
      with:
        rm_cmd: "rmz"
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: 'cybertreiber'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cmd-format: nix develop -c {0}
        key: ${{ hashFiles('flake.lock') }}
        workspaces: |
          . -> target
          runtime -> target
        cache-workspace-crates: true
    - name: Run tests, benchmarks, conformance, and clippy
      run: |
        nix develop -c bash -euo pipefail -c '
          cargo fetch --manifest-path runtime/Cargo.toml --locked
          cargo test --workspace --locked
          cargo test --locked --test benchmark -- --ignored --nocapture
          cargo test --manifest-path runtime/Cargo.toml --target-dir runtime/target --workspace --locked
          cargo test --manifest-path runtime/Cargo.toml --target-dir runtime/target -p perry-runtime --all-features --locked
          cargo clippy --manifest-path runtime/Cargo.toml --target-dir runtime/target --workspace --all-targets --all-features --locked -- -D warnings
          cargo run --locked -p perry-conformance -- check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        '

  flake-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4.0.1
      if: matrix.os == 'ubuntu-latest'
      with:
        rm_cmd: "rmz"
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: 'cybertreiber'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix flake check -L --keep-going
      if: matrix.os == 'ubuntu-latest'
    - env:
        TARGET: ${{ matrix.target }}
      run: |
        nix build -L .#perry-wit-release
        mkdir -p dist
        tar -czf "dist/perry-wit-${TARGET}.tar.gz" -C result/bin perry-wit
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: perry-wit-${{ matrix.target }}
        path: dist/perry-wit-${{ matrix.target }}.tar.gz
        if-no-files-found: error
    - name: Package runtime libraries, Wasm compiler, and npm tarball
      if: matrix.os == 'ubuntu-latest'
      run: |
        nix build -L .#runtime-libraries --out-link result-runtime-libraries
        tar -czf dist/perry-wit-runtime-libraries.tar.gz -C result-runtime-libraries lib
        nix build -L .#perry-wit-wasm --out-link result-compiler
        mkdir -p dist/compiler
        cp result-compiler/lib/perry-wit.wasm dist/compiler/
        cp result-compiler/share/perry-wit/compiler.wit dist/compiler/
        cp result-compiler/share/perry-wit/metadata.json dist/compiler/compiler.metadata.json
        nix build -L .#npm-package --out-link result-npm-package
        cp result-npm-package/perry-wit-*.tgz dist/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.os == 'ubuntu-latest'
      with:
        name: perry-wit-runtime-libraries
        path: dist/perry-wit-runtime-libraries.tar.gz
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.os == 'ubuntu-latest'
      with:
        name: perry-wit-compiler
        path: dist/compiler/
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.os == 'ubuntu-latest'
      with:
        name: perry-wit-npm-package
        path: dist/perry-wit-*.tgz
        if-no-files-found: error

  bench-perry:
    needs: flake-build
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: 'cybertreiber'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Run upstream Perry benchmarks
      id: bench-perry
      continue-on-error: true
      timeout-minutes: 20
      run: nix run -L .#bench-perry
    - name: Upload benchmark report
      id: bench-perry-artifact
      if: ${{ !cancelled() && steps.bench-perry.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bench-perry-${{ matrix.os }}
        path: artifacts/bench-perry/
        if-no-files-found: error
    - name: Summarize benchmarks
      if: ${{ !cancelled() && steps.bench-perry.outcome != 'skipped' }}
      env:
        ARTIFACT_URL: ${{ steps.bench-perry-artifact.outputs.artifact-url }}
      run: |
        printf '[Download benchmark report and logs](%s)\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
        cat artifacts/bench-perry/summary.md >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [flake-build, site]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: perry-wit-*
        merge-multiple: true
        path: dist
    - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: dist/*
        generate_release_notes: true

  site:
    needs: flake-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: cybertreiber
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: perry-wit-npm-package
        path: dist/npm-package
    - run: nix run -L .#site
    - run: |
        nix develop .#browser -c bash -euo pipefail <<'EOF'
          tarball=(dist/npm-package/perry-wit-*.tgz)
          tar -xzf "${tarball[0]}" -C js/packages/perry-wit --strip-components=1
          npm ci --prefix js --ignore-scripts --no-audit --no-fund
          npm --prefix js run test:e2e -- --tarball "${tarball[0]}"
          node js/site/check-browser.mjs
        EOF
      env:
        DEBUG: pw:browser
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: static-site
        path: js/site/dist/
        include-hidden-files: true
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: browser-results
        path: js/site/test-results
    - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
      if: github.ref == 'refs/heads/main'
      with:
        path: js/site/dist

  deploy-pages:
    needs: [site, conformance-and-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
    - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      id: deployment
    - name: Smoke check public assets
      env:
        SITE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        curl --fail --retry 5 --retry-delay 5 "$SITE_URL"
        curl --fail --retry 5 --retry-delay 5 "${SITE_URL}play/"
        curl --fail --retry 5 --retry-delay 5 "${SITE_URL}examples/merge_docs/doc1.json"
        curl --fail --retry 5 --retry-delay 5 "${SITE_URL}sizes.json"
