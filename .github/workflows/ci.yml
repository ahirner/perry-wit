name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  conformance-and-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: endersonmenezes/free-disk-space@v4
      with:
        rm_cmd: "rmz"
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: 'cybertreiber'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix develop -c cargo test --workspace --locked
    - run: nix develop -c cargo test -p perry-runtime --all-features --locked
    - run: nix develop -c cargo run --locked -p perry-conformance -- check
    - run: nix develop -c cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  flake-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
    - uses: endersonmenezes/free-disk-space@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        rm_cmd: "rmz"
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v17
      with:
        name: 'cybertreiber'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix --version
    - run: nix flake check -L --keep-going
    - run: nix flake show
    - run: nix develop -L -c echo built
    - run: nix build -L .#perry-wit
    - run: |
        mkdir -p dist
        tar -czf "dist/perry-wit-${{ matrix.target }}.tar.gz" -C result/bin perry-wit
    - uses: actions/upload-artifact@v7
      with:
        name: perry-wit-${{ matrix.target }}
        path: dist/perry-wit-${{ matrix.target }}.tar.gz
        if-no-files-found: error
    - run: nix build -L .#core-helpers --out-link result-helpers
    - run: |
        mkdir -p dist
        tar -czf dist/perry-wit-core-helpers.tar.gz -C result-helpers lib
    - uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: perry-wit-core-helpers
        path: dist/perry-wit-core-helpers.tar.gz
        if-no-files-found: error

  release:
    needs: [flake-build, site]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: perry-wit-*
        merge-multiple: true
        path: dist
    - uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true

  site:
    needs: flake-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: cybertreiber
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix run -L .#site
    - run: nix develop .#browser -c npm ci --prefix site --ignore-scripts --no-audit --no-fund
    - run: nix develop .#browser -c node site/check-browser.mjs
      env:
        DEBUG: pw:browser
    - run: |
        mkdir -p dist
        cp site/dist/downloads/perry-wit.wasm dist/
        cp site/dist/downloads/compiler.wit dist/
        cp site/dist/downloads/compiler.metadata.json dist/
    - uses: actions/upload-artifact@v7
      with:
        name: perry-wit-compiler
        path: dist/*
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: browser-results
        path: site/test-results
    - uses: actions/upload-pages-artifact@v4
      if: github.ref == 'refs/heads/main'
      with:
        path: site/dist

  deploy-pages:
    needs: [site, conformance-and-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@v5
    - uses: actions/deploy-pages@v4
      id: deployment
    - name: Smoke check public assets
      env:
        SITE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        curl --fail --retry 5 --retry-delay 5 "$SITE_URL"
        curl --fail --retry 5 --retry-delay 5 "${SITE_URL}play/"
        curl --fail --retry 5 --retry-delay 5 "${SITE_URL}examples/merge_docs/doc1.json"
        curl --fail --retry 5 --retry-delay 5 "${SITE_URL}sizes.json"
