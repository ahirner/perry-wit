[package]
name = "perry-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
perry-wit = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
proptest = "1.11"
proptest-state-machine = "0.8"
tempfile = "3.27"
wit-parser = "0.261"
wasmtime = { version = "49.0.2", default-features = false, features = ["component-model-async", "cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p3"] }
tokio = { version = "1", features = ["rt", "time", "fs", "io-util"] }

