[package]
name = "guest-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate"] }
wit-bindgen = { version = "0.61.1", default-features = false, features = ["macros"] }
