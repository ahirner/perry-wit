[package]
name = "perry-std"
version = "0.1.0"
edition = "2024"
publish = false
description = "Built-ins (strings, Uint8Array, JSON, random) linked into perry-wit components on demand"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libm = "0.2"

# On the host, the runtime's own functions stand in for the imports of linked modules.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
perry-runtime = { path = "../perry-runtime" }
