[package]
name = "pliron-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A WebAssembly dialect for pliron and an emitter from SSA control-flow graphs to core Wasm"
keywords = ["pliron", "webassembly", "compiler", "ir", "ssa"]
categories = ["compilers", "wasm"]
# Kept free of perry-specific code so it can be published on its own.
publish = false

[dependencies]
pliron = { git = "https://github.com/pliron-org/pliron", rev = "6ff5b3c8a6d5553b8cbee19d58f3c039f10e5a97" }
thiserror = "2"
wasm-encoder = "0.261"

[dev-dependencies]
wasmparser = "0.261"
wasmprinter = "0.261"
wasmtime.workspace = true
